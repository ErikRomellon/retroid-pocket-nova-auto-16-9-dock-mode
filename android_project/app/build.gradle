plugins {
    id 'com.android.application'
}

android {
    namespace 'com.retroid.novaautotv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.retroid.novaautotv'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '3.0'
    }

    signingConfigs {
        release {
            storeFile file('../../.toolchain/release.jks')
            storePassword 'novaautotv'
            keyAlias 'novaautotv'
            keyPassword 'novaautotv'
        }
    }

    buildTypes {
        release {
            // Sin minify: WindowSize usa reflexion sobre APIs ocultas.
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // Libreria (no app externa) para poder llamar a APIs ocultas en Android 9+.
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
}
